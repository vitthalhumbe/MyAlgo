name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.0
        env:
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64"
          CIBW_BEFORE_ALL_LINUX: "yum install -y cmake && cd /tmp && curl -L https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | tar xz && cd eigen-3.4.0 && cmake -DCMAKE_INSTALL_PREFIX=/usr . && make install"
          CIBW_ENVIRONMENT: EIGEN_INCLUDE="/usr/include/eigen3"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: wheelhouse/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1