name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Install dependencies
        run: pip install pytest pybind11 numpy tqdm scikit-learn matplotlib pandas
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: pytest tests/