name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Install and build
        run: pip install -e ".[dev]" --break-system-packages
      - name: Run tests
        run: pytest tests/